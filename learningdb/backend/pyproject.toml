[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learningdb-cli"
version = "0.1.0"
description = "LearningDB local orchestration CLI"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.35",
  "mysql-connector-python==9.0.0",
  "pandas==2.2.2",
  "python-dotenv==1.0.1",
  "pydantic==2.9.2",
  "typer==0.12.5",
]

[project.scripts]
learningdb = "cli:main"

[tool.setuptools]
py-modules = ["cli", "main", "crud", "database"]
